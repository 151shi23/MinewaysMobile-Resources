name: 资源投稿
description: 投稿地图、人物模型、纹理包或通用资源
title: "[资源] "
labels: ["resource"]
body:
  - type: markdown
    attributes:
      value: |
        官方资源建议附 GitHub Release；云盘资源请提供长期有效的分享链接。
        提交即表示你有权分发该资源，并同意维护者审核、修改目录信息。
  - type: dropdown
    id: type
    attributes:
      label: 资源类型
      options:
        - 地图
        - 人物模型
        - 纹理包
        - 通用资源
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: 标题
    validations:
      required: true
  - type: input
    id: creator
    attributes:
      label: 创作者
      description: 真实作者，不是上传者
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 许可证 / 授权
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: 托管方式
      options:
        - GitHub Release
        - 云盘分享
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Release 或云盘链接
      description: 只接受 https；GitHub Release 请给完整 asset 地址
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: 云盘提取码
      description: 没有就留空
  - type: textarea
    id: summary
    attributes:
      label: 简介
      description: 一句话说明玩法/风格/适用版本
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我拥有分发权，资源不含恶意内容
          required: true
