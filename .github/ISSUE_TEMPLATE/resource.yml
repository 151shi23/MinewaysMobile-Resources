name: 资源投稿
description: 投稿地图、人物模型、纹理包或通用资源
title: "[资源] "
labels: ["resource"]
body:
  - type: markdown
    attributes:
      value: |
        官方资源建议附 GitHub Release；云盘资源请提供长期有效的分享链接。
        提交即表示你有权分发该资源，并同意维护者审核、修改目录信息。
  - type: dropdown
    id: type
    attributes:
      label: 资源类型
      options:
        - 地图
        - 人物模型
        - 纹理包
        - 通用资源
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 大分类（必选）
      options:
        - 地图
        - 模型
        - 纹理
        - 通用
    validations:
      required: true
  - type: dropdown
    id: subcategory
    attributes:
      label: 小分类（必选）
      description: 必须和大分类对应，例如 模型 → 生物模型
      options:
        - 地图 / 生存
        - 地图 / 建筑
        - 地图 / 冒险
        - 地图 / 空岛
        - 地图 / 小游戏
        - 地图 / 地形
        - 地图 / 红石
        - 模型 / 生物模型
        - 模型 / 人物模型
        - 模型 / 武器道具
        - 模型 / 载具
        - 模型 / 方块构件
        - 模型 / 场景道具
        - 模型 / 动画模型
        - 纹理 / 材质包
        - 纹理 / 光影
        - 纹理 / 方块纹理
        - 纹理 / 界面纹理
        - 纹理 / 天空盒
        - 通用 / 工具
        - 通用 / 模板工程
        - 通用 / 音频
        - 通用 / 教程文档
        - 通用 / 脚本
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: 标题
    validations:
      required: true
  - type: input
    id: creator
    attributes:
      label: 创作者
      description: 真实作者，不是上传者
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 许可证 / 授权
      description: 例：CC-BY-4.0（CC BY 4.0 署名）
    validations:
      required: true
  - type: checkboxes
    id: transfer
    attributes:
      label: 传输方式
      options:
        - label: 我是第三方传输（非原作者），已获得授权并会在详情页声明出处与署名
  - type: input
    id: attribution
    attributes:
      label: 署名 / 出处声明
      description: 第三方传输必填，例：骨龙 · 作者 dzy · 第三方传输 · CC BY 4.0
  - type: dropdown
    id: storage
    attributes:
      label: 托管方式
      options:
        - GitHub Release
        - 云盘分享
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Release 或云盘链接
      description: 只接受 https；GitHub Release 请给完整 asset 地址
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: 云盘提取码
      description: 没有就留空
  - type: textarea
    id: summary
    attributes:
      label: 简介
      description: 一句话说明玩法/风格/适用版本
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我拥有分发权，资源不含恶意内容
          required: true
