name: 资源投稿
description: 投稿地图、人物模型、纹理包或通用资源
title: "[资源] "
labels: ["resource"]
body:
  - type: markdown
    attributes:
      value: |
        官方资源建议附 GitHub Release；云盘资源请提供长期有效的分享链接。
        提交即表示你有权分发该资源，并同意维护者审核、修改目录信息。
  - type: dropdown
    id: type
    attributes:
      label: 资源类型
      options:
        - 地图
        - 人物模型
        - 纹理包
        - 通用资源
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 大分类（必选）
      description: 先按 Java / 基岩 版本，再按资源类型
      options:
        - Java 地图
        - Java 模型
        - Java 材质
        - Java 模组
        - Java 光影
        - Java 皮肤
        - Java 工具
        - 基岩地图
        - 基岩模型
        - 基岩材质
        - 基岩附加包
        - 基岩皮肤
        - 基岩工具
        - 通用跨版本
        - 其他资源
    validations:
      required: true
  - type: dropdown
    id: subcategory
    attributes:
      label: 小分类（必选）
      description: 必须和大分类对应，例如 基岩模型 → 生物模型
      options:
        - Java 地图 / 生存
        - Java 地图 / 建筑
        - Java 地图 / 冒险
        - Java 地图 / 空岛
        - Java 模型 / 生物模型
        - Java 模型 / 人物模型
        - Java 模型 / 动画模型
        - Java 材质 / 写实材质
        - Java 材质 / 卡通材质
        - Java 模组 / 科技模组
        - Java 模组 / 魔法模组
        - Java 光影 / 写实光影
        - Java 光影 / 卡通光影
        - Java 皮肤 / 男皮肤
        - Java 皮肤 / 女皮肤
        - Java 工具 / 编辑器
        - Java 工具 / 转换器
        - 基岩地图 / 生存
        - 基岩地图 / 建筑
        - 基岩模型 / 生物模型
        - 基岩模型 / 人物模型
        - 基岩模型 / 动画模型
        - 基岩材质 / 写实材质
        - 基岩材质 / 卡通材质
        - 基岩附加包 / 玩法附加
        - 基岩附加包 / 科技附加
        - 基岩皮肤 / Q版皮肤
        - 基岩皮肤 / 男皮肤
        - 基岩工具 / 编辑器
        - 通用跨版本 / 界面 UI
        - 通用跨版本 / 音效音乐
        - 通用跨版本 / 动捕动画
        - 其他资源 / 杂项
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: 标题
    validations:
      required: true
  - type: input
    id: creator
    attributes:
      label: 创作者
      description: 真实作者，不是上传者
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 许可证 / 授权
      description: 例：CC-BY-4.0（CC BY 4.0 署名）
    validations:
      required: true
  - type: checkboxes
    id: transfer
    attributes:
      label: 传输方式
      options:
        - label: 我是第三方传输（非原作者），已获得授权并会在详情页声明出处与署名
  - type: input
    id: attribution
    attributes:
      label: 署名 / 出处声明
      description: 第三方传输必填，例：骨龙 · 作者 dzy · 第三方传输 · CC BY 4.0
  - type: dropdown
    id: storage
    attributes:
      label: 托管方式
      options:
        - GitHub Release
        - 云盘分享
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Release 或云盘链接
      description: 只接受 https；GitHub Release 请给完整 asset 地址
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: 云盘提取码
      description: 没有就留空
  - type: textarea
    id: summary
    attributes:
      label: 简介
      description: 一句话说明玩法/风格/适用版本
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我拥有分发权，资源不含恶意内容
          required: true
