name: validate-resources

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build catalog hashes
        run: python tools/build_catalog.py
      - name: Validate catalog
        run: python tools/validate_resources.py
      - name: Check generated files are committed
        run: git diff --exit-code -- catalog.json
